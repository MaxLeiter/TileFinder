# Important: every field used in resource templates must be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle
# Per-Minecraft-version settings (Minecraft, Java, loader, API and recipe viewer versions) are in
# stonecutter.properties.toml.

# Project
version=1.0.1
group=com.maxleiter.tilefinder

# Common
mod_name=TileFinder
mod_author=Max Leiter
mod_id=tilefinder
license=MIT
credits=
description=Find the block entities around you: chests, machines, cables and everything else a modpack hides in your base.
homepage=https://github.com/MaxLeiter/TileFinder
issues=https://github.com/MaxLeiter/TileFinder/issues

# Publishing (build-logic multiloader-publish.gradle, .github/workflows/release.yml)
# The tokens are never kept here: they come from the environment (MODRINTH_TOKEN, CURSEFORGE_TOKEN).
modrinth_id=HPYRSZMx
curseforge_id=1288981
# The release type of versions without an -alpha or -beta suffix: alpha, beta or release.
release_type=release
# CurseForge refuses relations to projects still in moderation. Vellum GUI (1729464) was new on 2026-10-06: set this
# to true once https://www.curseforge.com/minecraft/mc-mods/vellum-gui is approved.
curseforge_vellum_relation=false

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.caching=true
# The build scripts are Groovy; this silences Stonecutter's suggestion to move them to Kotlin.
dev.kikugie.stonecutter.hard_mode=true
