plugins {
    id 'multiloader-loader'
}

// 26.x is unobfuscated and builds with Loom as it is. Older versions are obfuscated: they build with the remapping
// Loom, against Mojang's mappings, and the jar is remapped to intermediary names.
def obfuscated = stonecutter.current.parsed < '26'
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

if (obfuscated) {
    // java.withSourcesJar() (multiloader-common) ran before Loom was applied, so the plain sources jar is still in the
    // published variant beside Loom's remapped one: keep the remapped one.
    afterEvaluate {
        configurations.named('sourcesElements') {
            outgoing.artifacts.removeIf { it.buildDependencies.getDependencies(null).contains(tasks.sourcesJar) }
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    // modX on the obfuscated versions (remapped by Loom), plain configurations on 26.x.
    def mod = { String configuration -> obfuscated ? "mod${configuration.capitalize()}" : configuration }
    if (obfuscated) mappings(loom.officialMojangMappings())
    add(mod('implementation'), "net.fabricmc:fabric-loader:${fabric_loader_version}")
    add(mod('implementation'), "net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // A required mod of its own, not bundled: players get Vellum's fixes without a TileFinder release.
    add(mod('implementation'), "dev.vellum:vellum-fabric-${minecraft_version}:${vellum_version}")

    add(mod('compileOnly'), "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    add(mod('compileOnly'), "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive = false }
    add(mod('compileOnly'), "dev.architectury:architectury-fabric:${architectury_version}") { transitive = false }
    add(mod('compileOnly'), "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { transitive = false }
    // REI's API uses me.shedaniel.math, which Fabric's cloth-config only nests as a jar.
    compileOnly('me.shedaniel.cloth:basic-math:0.6.1')
    if (obfuscated) {
        add(mod('compileOnly'), "dev.emi:emi-fabric:${emi_version}:api") { transitive = false }
    }
    add(mod('compileOnly'), "com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    if (!project.hasProperty('noViewers')) {
        if (project.hasProperty('rei')) {
            add(mod('localRuntime'), "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
        } else if (project.hasProperty('emi') && obfuscated) {
            add(mod('localRuntime'), "dev.emi:emi-fabric:${emi_version}") { transitive = false }
        } else {
            add(mod('localRuntime'), "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = false
        modId = mod_id
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}

loom {
    // Common's access widener, with its Stonecutter comments resolved for this version.
    accessWidenerPath.set(stonecutter.process(rootProject.file("common/src/main/resources/${mod_id}.accesswidener"),
            "build/stonecutter-processed/${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            if (project.hasProperty('autopilot')) property('tilefinder.autopilot', project.property('autopilot').toString() ?: 'true')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

tasks.matching { it.name == 'runGameTest' }.configureEach {
    doFirst { delete layout.buildDirectory.dir('run/gameTest/world') }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
